apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edupplan-ingress
  namespace: edupplan
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edupplan-frontend-service
                port:
                  number: 8501
