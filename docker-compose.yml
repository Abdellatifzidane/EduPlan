services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: eduplan_postgres
    environment:
      POSTGRES_USER: eduplan_user
      POSTGRES_PASSWORD: eduplan_password
      POSTGRES_DB: eduplan_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/data/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduplan_user -d eduplan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: eduplan_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduplan_backend
    environment:
      DATABASE_URL: postgresql://eduplan_user:eduplan_password@postgres:5432/eduplan_db
      REDIS_URL: redis://redis:6379
      GROQ_API_KEY: "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"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Streamlit
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduplan_frontend
    environment:
      API_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    volumes:
      - ./frontend:/app
    ports:
      - "8501:8501"
    depends_on:
      - backend
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

volumes:
  postgres_data:
  redis_data:
